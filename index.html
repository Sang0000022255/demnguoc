<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đếm ngược Ngày lễ Việt Nam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ---- BIẾN MÀU & CÀI ĐẶT CHUNG ---- */
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --text-dark: #f8fafc;
      --text-muted-dark: #94a3b8;
      --progress-bg-dark: #334155;
      --green: #22c55e;
      
      --bg-light: #f4f4f5;
      --card-light: #ffffff;
      --text-light: #111827;
      --text-muted-light: #6b7280;
      --progress-bg-light: #e5e7eb;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-dark);
      margin: 0; padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    
    /* ---- BỐ CỤC CHÍNH ---- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    h1 { margin: 0; font-size: 24px; }
    .top-actions { display: flex; gap: 10px; }
    
    .control-bar {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      background: var(--card-dark);
      padding: 12px;
      border-radius: 10px;
    }
    .ctrl {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--progress-bg-dark);
      background: var(--bg-dark);
      color: var(--text-dark);
      font-size: 14px;
      cursor: pointer;
    }
    .ctrl:hover {
      border-color: var(--text-muted-dark);
    }
    input[type="text"], input[type="number"], input[type="date"] {
      padding: 5px; border-radius: 6px; border: 1px solid #ccc;
      background: #f0f0f0;
      color: #333;
    }
    label.ctrl {
      border: none;
      background: none;
      padding: 0;
      display: flex; align-items: center; gap: 5px;
    }

    /* ---- DANH SÁCH THẺ ---- */
    #eventList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-dark);
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      position: relative; /* Dùng cho nút xóa */
    }
    .card:hover { transform: translateY(-3px); }
    .name { font-size: 18px; font-weight: bold; padding-right: 25px; } /* Chừa chỗ cho nút xóa */
    .date { font-size: 14px; color: var(--text-muted-dark); margin-top: 4px; }
    .countdown { font-size: 16px; margin-top: 10px; }
    .countdown-days {
      font-size: 26px;
      font-weight: bold;
      color: #34d399; /* Màu xanh lá sáng */
      margin: 0 5px;
    }
    .progress {
      margin-top: 10px; background: var(--progress-bg-dark);
      border-radius: 6px; height: 10px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: var(--green);
      width: 0%; transition: width 1s ease-in-out;
    }
    
    /* Trạng thái đã qua */
    .passed .countdown-days { color: var(--text-muted-dark); }
    .passed .progress-bar { background: var(--text-muted-dark); }

    /* ---- NÚT XÓA SỰ KIỆN TÙY CHỈNH ---- */
    .delete-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px; height: 24px;
      font-size: 12px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: #dc2626; }

    /* ---- MODAL (Cửa sổ bật lên) ---- */
    #modal-backdrop {
      display: none; /* Ẩn mặc định */
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s;
    }
    .modal-content {
      background: var(--card-dark);
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content input { width: 95%; }
    .modal-actions {
      margin-top: 20px;
      display: flex; gap: 10px; justify-content: flex-end;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---- CHỦ ĐỀ SÁNG (Light Theme) ---- */
    body.light { background: var(--bg-light); color: var(--text-light); }
    body.light .card { background: var(--card-light); }
    body.light .date { color: var(--text-muted-light); }
    body.light .progress { background: var(--progress-bg-light); }
    body.light .control-bar { background: var(--card-light); }
    body.light .ctrl {
      background: var(--bg-light);
      color: var(--text-light);
      border-color: var(--progress-bg-light);
    }
    body.light label.ctrl { border: none; background: none; }
    body.light .ctrl:hover { border-color: #aaa; }
    body.light .passed .countdown-days { color: var(--text-muted-light); }
    body.light .passed .progress-bar { background: var(--text-muted-light); }
    body.light .countdown-days { color: #10b981; }
    body.light .modal-content { background: var(--card-light); }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>📅 Đếm ngược Ngày lễ</h1>
    <div class="top-actions">
      <button id="themeToggle" class="ctrl">🌙</button>
      <button id="addEventBtn" class="ctrl">➕ Thêm</button>
    </div>
  </div>

  <div class="control-bar">
    <label class="ctrl">Năm:
      <input id="yearInput" type="number" min="2024" max="2030" value="2025">
    </label>
    <label class="ctrl">Tìm:
      <input id="searchInput" type="text" placeholder="Ví dụ: Quốc khánh...">
    </label>
    <label class="ctrl">
      <input id="togglePast" type="checkbox" checked> Hiện sự kiện đã qua
    </label>
  </div>

  <div id="eventList"></div>

  <div id="modal-backdrop">
    <div class="modal-content">
      <h3>Thêm sự kiện cá nhân</h3>
      <label>Tên sự kiện:</label><br>
      <input id="customName" type="text" style="margin-top: 5px;"><br><br>
      <label>Ngày diễn ra:</label><br>
      <input id="customDate" type="date" style="margin-top: 5px;"><br>
      <div class="modal-actions">
        <button id="cancelEvent" class="ctrl">Hủy</button>
        <button id="saveEvent" class="ctrl">Lưu</button>
      </div>
    </div>
  </div>

  <script>
  function INT(d){return Math.floor(d);}
  function jdFromDate(dd, mm, yy) {
    var a = INT((14 - mm) / 12);
    var y = yy+4800-a;
    var m = mm+12*a-3;
    var jd = dd + INT((153*m+2)/5) + 365*y + INT(y/4) - INT(y/100) + INT(y/400) - 32045;
    if (jd < 2299161) jd = dd + INT((153*m+2)/5) + 365*y + INT(y/4) - 32083;
    return jd;
  }
  function jdToDate(jd) {
    var a, b, c, d, e, m;
    if (jd > 2299160) {
      a = jd + 32044;
      b = INT((4*a+3)/146097);
      c = a - INT((b*146097)/4);
    } else {
      b = 0; c = jd + 32082;
    }
    d = INT((4*c+3)/1461);
    e = c - INT((1461*d)/4);
    m = INT((5*e+2)/153);
    var day = e - INT((153*m+2)/5) + 1;
    var month = m + 3 - 12*INT(m/10);
    var year = b*100 + d - 4800 + INT(m/10);
    return [day, month, year];
  }
  function getNewMoonDay(k, timeZone) {
    var T = k/1236.85, T2=T*T, T3=T2*T;
    var dr = Math.PI/180;
    var Jd1 = 2415020.75933 + 29.53058868*k + 0.0001178*T2 - 0.000000155*T3;
    Jd1 += 0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
    var M = 359.2242 + 29.10535608*k - 0.0000333*T2 - 0.00000347*T3;
    var Mpr = 306.0253 + 385.81691806*k + 0.0107306*T2 + 0.00001236*T3;
    var F = 21.2964 + 390.67050646*k - 0.0016528*T2 - 0.00000239*T3;
    var C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
    C1 -=0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);
    C1 -=0.0004*Math.sin(dr*3*Mpr)+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));
    C1 -=0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));
    C1 -=0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr))+0.0010*Math.sin(dr*(2*F-Mpr));
    var JdNew = Jd1 + C1;
    return INT(JdNew+0.5+timeZone/24);
  }
  function getSunLongitude(jdn, timeZone) {
    var T = (jdn - 2451545.5 - timeZone/24) / 36525;
    var T2 = T*T, dr=Math.PI/180;
    var M = 357.52910 + 35999.05030*T - 0.0001559*T2 - 0.00000048*T*T2;
    var L0 = 280.46645 + 36000.76983*T + 0.0003032*T2;
    var DL = (1.914600 - 0.004817*T - 0.000014*T2)*Math.sin(dr*M);
    DL += (0.019993 - 0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
    var L = L0 + DL;
    var omega = 125.04 - 1934.136*T;
    L -=0.00569+0.00478*Math.sin(omega*dr);
    L = L*dr;
    L = L-2*Math.PI*INT(L/(2*Math.PI));
    return INT(L/(Math.PI*6));
  }
  function getLunarMonth11(yy, timeZone) {
    var off = jdFromDate(31, 12, yy) - 2415021;
    var k = INT(off/29.530588853);
    var nm = getNewMoonDay(k, timeZone);
    if (getSunLongitude(nm, timeZone) >= 9) nm = getNewMoonDay(k-1, timeZone);
    return nm;
  }
  function convertLunar2Solar(dd, mm, yy, leap, timeZone) {
    var a11, off, k, monthStart;
    if (mm < 11) { a11 = getLunarMonth11(yy-1, timeZone); } 
    else { a11 = getLunarMonth11(yy, timeZone); }
    off = dd-1;
    k = INT(0.5+(a11-2415021.076998695)/29.530588853);
    monthStart = getNewMoonDay(k+mm, timeZone);
    var jd = monthStart+off;
    return jdToDate(jd);
  }
  </script>

  <script>
    const HOLIDAYS = [
      { name:"Tết Dương lịch", emoji:"🎉", month:1, day:1 },
      { name:"Ngày thành lập Đảng", emoji:"🚩", month:2, day:3 },
      { name:"Lễ Tình nhân (Valentine)", emoji:"❤️", month:2, day:14 },
      { name:"Ngày Thầy thuốc Việt Nam", emoji:"⚕️", month:2, day:27 },
      { name:"Ngày Quốc tế Phụ nữ", emoji:"🌸", month:3, day:8 },
      { name:"Giỗ Tổ Hùng Vương", emoji:"👑", month:4, day:18 }, // Cập nhật năm 2025 (Âm lịch 10/3)
      { name:"Ngày Giải phóng miền Nam", emoji:"🇻🇳", month:4, day:30 },
      { name:"Ngày Quốc tế Lao động", emoji:"⚒️", month:5, day:1 },
      { name:"Ngày sinh Chủ tịch Hồ Chí Minh", emoji:"🌟", month:5, day:19 },
      { name:"Ngày Quốc tế Thiếu nhi", emoji:"👦👧", month:6, day:1 },
      { name:"Ngày Thương binh Liệt sĩ", emoji:"🕯️", month:7, day:27 },
      { name:"Cách mạng tháng Tám", emoji:"🔥", month:8, day:19 },
      { name:"Quốc khánh", emoji:"🎆", month:9, day:2 },
      { name:"Ngày Phụ nữ Việt Nam", emoji:"💐", month:10, day:20 },
      { name:"Ngày Nhà giáo Việt Nam", emoji:"📚", month:11, day:20 },
      { name:"Ngày thành lập QĐND", emoji:"🪖", month:12, day:22 },
      { name:"Giáng sinh", emoji:"🎄", month:12, day:25 }
    ];
    // Sửa Trung Thu về đúng ngày 15/8 Âm lịch
    const LUNAR_HOLIDAYS = [
      { name:"Tết Nguyên Đán", emoji:"🧧", month:1, day:1 },
      { name:"Rằm tháng Giêng", emoji:"🌕", month:1, day:15 },
      { name:"Tết Đoan Ngọ", emoji:"🍑", month:5, day:5 },
      { name:"Vu Lan Báo Hiếu", emoji:"🙏", month:7, day:15 },
      { name:"Tết Trung Thu", emoji:"🥮", month:8, day:15 }
    ];

    // ---- LOGIC GIAO DIỆN MỚI ----
    const themeToggle=document.getElementById("themeToggle");
    const addEventBtn=document.getElementById("addEventBtn");
    const modalBackdrop=document.getElementById("modal-backdrop");
    const saveEventBtn=document.getElementById("saveEvent");
    const cancelEventBtn=document.getElementById("cancelEvent");

    // 1. Theme
    if(localStorage.getItem("theme")==="light") {
        document.body.classList.add("light");
        themeToggle.textContent = "☀️";
    } else {
        themeToggle.textContent = "🌙";
    }
    themeToggle.addEventListener("click",()=>{
      document.body.classList.toggle("light");
      const isLight = document.body.classList.contains("light");
      localStorage.setItem("theme", isLight ? "light" : "dark");
      themeToggle.textContent = isLight ? "☀️" : "🌙";
    });

    // 2. Modal
    addEventBtn.addEventListener("click", () => { modalBackdrop.style.display = "flex"; });
    cancelEventBtn.addEventListener("click", () => { modalBackdrop.style.display = "none"; });
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) modalBackdrop.style.display = "none";
    });
    
    // 3. Lưu sự kiện (Đã thêm ID để xóa)
    saveEventBtn.addEventListener("click",()=>{
      const name=document.getElementById("customName").value;
      const date=document.getElementById("customDate").value;
      if(name && date){
        const events=JSON.parse(localStorage.getItem("customEvents")||"[]");
        // Thêm ID để có thể xóa
        events.push({name: name, emoji:"⭐", absolute: date, id: Date.now()}); 
        localStorage.setItem("customEvents",JSON.stringify(events));
        render();
        modalBackdrop.style.display="none";
        document.getElementById("customName").value = "";
        document.getElementById("customDate").value = "";
      }
    });

    // 4. HÀM MỚI: Xóa sự kiện
    function deleteEvent(id) {
        if (!confirm("Bạn có chắc muốn xóa sự kiện này?")) return;
        let events = JSON.parse(localStorage.getItem("customEvents") || "[]");
        events = events.filter(e => e.id !== id);
        localStorage.setItem("customEvents", JSON.stringify(events));
        render();
    }
    
    // ---- LOGIC HIỂN THỊ (Render) ----
    
    function lunarToSolar(year){
      return LUNAR_HOLIDAYS.map(e=>{
        const d = convertLunar2Solar(e.day, e.month, year, 0, 7); 
        const dateStr = `${d[2]}-${String(d[1]).padStart(2,"0")}-${String(d[0]).padStart(2,"0")}`;
        return { ...e, absolute: dateStr };
      });
    }
    
    function getAllEvents(year){
      const customs=JSON.parse(localStorage.getItem("customEvents")||"[]");
      const holidays=HOLIDAYS.map(e=>({ 
        ...e, 
        absolute:`${year}-${String(e.month).padStart(2,"0")}-${String(e.day).padStart(2,"0")}`
      }));
      const lunar = lunarToSolar(year);
      return [...holidays, ...lunar, ...customs];
    }

    function render(){
      const list=document.getElementById("eventList");
      list.innerHTML="";
      const year=parseInt(document.getElementById("yearInput").value);
      const search=document.getElementById("searchInput").value.toLowerCase();
      const showPast=document.getElementById("togglePast").checked;
      const now=new Date();
      // Đặt giờ về 0 để so sánh ngày chính xác
      now.setHours(0, 0, 0, 0);

      let events=getAllEvents(year).filter(e=>e.name.toLowerCase().includes(search));
      
      events=events.map(e=>{
        const d=new Date(e.absolute);
        // Cần thêm 1 múi giờ vì new Date('YYYY-MM-DD') sẽ tạo ra 00:00 UTC, 
        // nhưng ở VN (+7) nó sẽ bị lùi về 1 ngày trước
        d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
        
        let diff=Math.ceil((d-now)/(1000*60*60*24));
        const startYear=new Date(year,0,1);
        
        // Tính tổng số ngày từ đầu năm đến ngày sự kiện
        // (chỉ có ý nghĩa nếu sự kiện diễn ra trong năm)
        const totalDays=Math.ceil((d-startYear)/(1000*60*60*24));
        const passedDays=Math.ceil((now-startYear)/(1000*60*60*24));
        
        let percent = 100; // Mặc định là 100% nếu đã qua
        if (diff > 0 && totalDays > 0) {
            percent = Math.min(100, Math.max(0, (passedDays / totalDays) * 100));
        } else if (diff < 0) {
            percent = 100;
        } else if (diff === 0) {
            percent = 100;
        }

        return { ...e, date:d, diff, percent };
      });
      
      events=events.filter(e=> showPast || e.diff>=0 );
      events.sort((a,b)=>a.date-b.date);

      events.forEach(ev=>{
        const card=document.createElement("div");
        card.className="card"+(ev.diff<0?" passed":"");
        
        let countdownText = "";
        if (ev.diff === 0) {
            countdownText = `🎉 <span class="countdown-days">HÔM NAY!</span> 🎉`;
        } else if (ev.diff > 0) {
            countdownText = `⏳ Còn <span class="countdown-days">${ev.diff}</span> ngày`;
        } else {
            countdownText = `✅ Đã qua <span class="countdown-days">${-ev.diff}</span> ngày`;
        }
        
        // Chỉ thêm nút xóa nếu sự kiện có ID (tức là sự kiện tùy chỉnh)
        const deleteButton = ev.id 
          ? `<button class="delete-btn" onclick="deleteEvent(${ev.id})">✖</button>` 
          : "";

        card.innerHTML=`
          <div class="name">${ev.emoji} ${ev.name}</div>
          <div class="date">📅 ${ev.date.toLocaleDateString("vi-VN")}</div>
          <div class="countdown">${countdownText}</div>
          <div class="progress"><div class="progress-bar" style="width:${ev.percent}%"></div></div>
          ${deleteButton}
        `;
        list.appendChild(card);
      });
    }

    // ---- CHẠY ỨNG DỤNG ----
    document.getElementById("yearInput").addEventListener("input",render);
    document.getElementById("searchInput").addEventListener("input",render);
    document.getElementById("togglePast").addEventListener("change",render);
    
    // Cập nhật mỗi 5 phút thay vì 1 phút
    setInterval(render, 5 * 60 * 1000); 
    render();
  </script>
</body>
</html>
